hypotheses:
  - id: H1
    statement: "The initial-population endpoint-XY bounds make later offspring overflow into edge cells, saturating occupancy and erasing behavior resolution; a physically calibrated or overflow-aware descriptor partition will reduce overflow while preserving task-relevant modes."
    status: pending
    motivation: "Historical valid QD profiles have median coverage 1.0 but overflow P95 0.938-1.0 and zero paired coverage gain."
    parent: null
    priority: high
  - id: H2
    statement: "Reward-only global-best execution and cell-local reward elitism preserve proxy quality that is weakly aligned with stage progress; stage-conditioned quality/selection will improve target progress and retain control-success tasks."
    status: pending
    motivation: "All QD variants had near-zero best-reward deltas while task outcomes ranged from 0/10 to 2/10 and lost control successes."
    parent: null
    priority: high
  - id: H3
    statement: "Fresh chunk-local archives select geometrically discontinuous actions, increasing trajectory length and chunk-boundary jump; bounded cross-chunk continuity or continuity-aware selection will reduce replanning discontinuity without collapsing search diversity."
    status: pending
    motivation: "QD trajectory medians and chunk-boundary P95 generally exceed the 0.093 m and 2.983 control references."
    parent: null
    priority: high
  - id: H4
    statement: "Uniform or inverse-visitation allocation over nearly saturated cells spends offspring on low-value niches; an explicit exploit/explore budget with quality guards will improve best-task progress at fixed 176 evaluations per complete chunk."
    status: pending
    motivation: "Sparse gains one new task but loses two control tasks; uniform primary loses all three control successes."
    parent: null
    priority: medium
  - id: H5
    statement: "A single endpoint descriptor and capacity-one archive merge manipulation behaviors whose future value differs by stage or trajectory shape; stage-aware descriptors or limited within-cell plurality will improve behavior retention."
    status: pending
    motivation: "The current descriptor omits Z, direction, gripper, trajectory shape, stage, and cross-chunk history."
    parent: null
    priority: medium


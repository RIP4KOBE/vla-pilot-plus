# ============================================================================
# RDT-LIBERO Evaluation Config (Isaac-GR00T Framework)
# ============================================================================
# 
# Usage:
#   python eval_fast/eval_rdt_libero.py --config eval_fast/config/eval_config.yaml
#
# ============================================================================

# ──────────────────────────────────────────────────────────────────────────
# 模型配置
# ──────────────────────────────────────────────────────────────────────────
model:
  # 预训练模型路径 (必填)
  # 示例: ./checkpoints/RDT-1B-Full-libero_10-from_libero90-ckpt65k-20251228_190942/checkpoint-78000
  pretrained_path: ./checkpoints/RDT-1B-Full-libero_10-from_libero90-ckpt65k-20251228_190942/checkpoint-28000
  
  # LoRA adapter 路径 (可选)
  # 如果使用 LoRA 微调的模型，填写 LoRA adapter 路径
  # lora_adapter: ./checkpoints/your_lora_checkpoint
  lora_adapter: null

# ──────────────────────────────────────────────────────────────────────────
# 数据集配置
# ──────────────────────────────────────────────────────────────────────────
dataset:
  # 数据集名称 (必选)
  # 可选项: libero_10, libero_90, libero_spatial, libero_object, libero_goal
  name: libero_10

# ──────────────────────────────────────────────────────────────────────────
# 评估配置
# ──────────────────────────────────────────────────────────────────────────
evaluation:
  # 每个任务的评估轨迹数 (episodes)
  # 快速测试: 3-5
  # 标准评估: 10
  # 完整评估: 20
  num_traj: 20
  
  # 随机种子 (用于结果可复现)
  seed: 20241201
  
  # GPU 设置 (指定使用哪个GPU)
  gpu: 0
  
  # 执行 horizon: 每次推理后执行多少步动作
  # 推荐值: 8 (平衡速度和精度)
  exec_horizon: 8
  
  # 最大步数
  max_episode_steps: 720
  
  # 视频保存配置
  video:
    # 视频保存间隔
    # 0: 不保存视频 (快速评估推荐)
    save_interval: 0
    
    # 视频保存根目录
    root_dir: outs/eval_videos

# ──────────────────────────────────────────────────────────────────────────
# 输出配置
# ──────────────────────────────────────────────────────────────────────────
output:
  # 评估结果保存目录
  metrics_dir: outs/eval_results

# ============================================================================
# 任务数量参考
# ============================================================================
#
# libero_10:      10 个任务
# libero_90:      90 个任务 (耗时较长)
# libero_spatial: 10 个任务
# libero_object:  10 个任务
# libero_goal:    10 个任务
#
# ============================================================================


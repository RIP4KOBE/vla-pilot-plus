# ============================================================================
# RDT-LIBERO 评估配置文件 (带 End Effector 轨迹追踪)
# ============================================================================
# 使用方法:
#   ./libero_rdt_eval_with_eef.sh libero_eval/config/eval_config_with_eef.yaml
#
# 说明: 此配置用于带 EEF 轨迹追踪的评估，会生成可视化图片
# ============================================================================

# ──────────────────────────────────────────────────────────────────────────
# 环境配置
# ──────────────────────────────────────────────────────────────────────────
environment:
  # LIBERO 仓库根目录路径 (必填)
  libero_repo_root: /home/zhukefei/chensiqi/LIBERO

# ──────────────────────────────────────────────────────────────────────────
# 数据集配置
# ──────────────────────────────────────────────────────────────────────────
dataset:
  # 数据集名称 (必选)
  # 可选项: libero_10, libero_90, libero_spatial, libero_object, libero_goal
  name: libero_spatial

# ──────────────────────────────────────────────────────────────────────────
# 模型配置
# ──────────────────────────────────────────────────────────────────────────
model:
  # 预训练模型路径 (必填)
  pretrained_path: ./checkpoints/RDT-1B-Full-libero_spatial-from_libero90-ckpt65k-20251205_120229/checkpoint-13000
  # pretrained_path: ./checkpoints/RDT-1B-Full-libero_object-from_libero90-ckpt65k-20251217_002639/checkpoint-22000


  # LoRA adapter 路径 (可选)
  # 如果使用 LoRA 微调的模型，填写 LoRA adapter 路径
  # 如果不使用，设为 null 或注释掉
  # lora_adapter: ./checkpoints/RDT-1B-LoRA-libero_spatial-r32a64-20251130_121056/checkpoint-4000
  lora_adapter: null


# ──────────────────────────────────────────────────────────────────────────
# 评估配置
# ──────────────────────────────────────────────────────────────────────────
evaluation:
  # 每个任务的评估轨迹数 (episodes)
  # 快速测试: 3-5
  # 标准评估: 10
  # 完整评估: 20
  num_traj: 5
  
  # 随机种子 (用于结果可复现)
  seed: 20241201
  
  # GPU 设置 (指定使用哪个GPU)
  # 例如: 0, 1, 2, 3, 4, 5, 6, 7
  gpu: 0
  
  # 执行 Horizon (每次推理后执行多少步动作)
  # 1: 每步都重新推理 (最高响应性，最高计算成本)
  # 8: 每8步推理一次 (推荐，平衡效率和性能)
  # 16: 每16步推理一次 (更高效率)
  exec_horizon: 8
  
  # 视频保存配置
  video:
    # 视频保存间隔
    # 0: 不保存视频 (快速评估推荐)
    # 5: 每5个任务保存一次
    # 10: 每10个任务保存一次 (标准评估推荐)
    # 1: 每个任务都保存 (调试用，占用大量存储)
    save_interval: 0   # 改为 1 表示每个任务都保存视频
    
    # 视频保存根目录
    root_dir: outs/eval_videos

# ──────────────────────────────────────────────────────────────────────────
# EEF 轨迹追踪配置 (新增)
# ──────────────────────────────────────────────────────────────────────────
eef_tracking:
  # EEF 轨迹数据保存目录
  save_dir: outs/eef_trajectories
  
  # 指定评估的任务ID (可选)
  # 格式: 用逗号分隔的任务ID，如 "0,1,2,3"
  # 留空或设为 null 表示评估全部任务
  # task_ids: "0,1,2"
  task_ids: null

# ──────────────────────────────────────────────────────────────────────────
# 输出配置
# ──────────────────────────────────────────────────────────────────────────
output:
  # 评估结果 CSV 文件保存目录
  metrics_dir: outs/metrics
  
  # CSV 文件名前缀 (用于区分不同实验)
  prefix: "EEF_"

# ============================================================================
# 输出目录结构说明
# ============================================================================
# 每次测评会创建独立的文件夹，包含时间戳以区分不同测评：
#
# {eef_tracking.save_dir}/
# └── {dataset.name}/
#     └── {timestamp}_{checkpoint_name}_seed{seed}_eps{num_traj}/
#         ├── task0_eef_trajectories.json      # 原始轨迹数据
#         ├── task1_eef_trajectories.json
#         ├── ...
#         └── visualizations/                  # 可视化图片
#             ├── task0_3d_trajectories.png    # 3D 空间轨迹图
#             ├── task0_x_over_time.png        # X 位置随时间变化
#             ├── task0_y_over_time.png        # Y 位置随时间变化
#             ├── task0_z_over_time.png        # Z 位置随时间变化
#             ├── task0_rx_over_time.png       # Roll 角度随时间变化
#             ├── task0_ry_over_time.png       # Pitch 角度随时间变化
#             ├── task0_rz_over_time.png       # Yaw 角度随时间变化
#             └── ...
#
# 示例输出路径:
#   outs/eef_trajectories/libero_90/20241204_153000_checkpoint-65000_seed20241201_eps10/
#
# 每个任务生成 7 张图片，libero_90 共 90 × 7 = 630 张图片
#
# ============================================================================
# 常用配置组合参考
# ============================================================================
#
# 【快速测试】 - 验证脚本和可视化
#   dataset.name: libero_10
#   num_traj: 3
#   task_ids: "0,1,2"  # 只评估前3个任务
#
# 【标准评估】 - 完整评估 + EEF 追踪
#   dataset.name: libero_10
#   num_traj: 10
#   task_ids: null
#
# 【完整评估 libero_90】
#   dataset.name: libero_90
#   num_traj: 20
#   task_ids: null
#
# ============================================================================


# @package policy
# Policy Configuration
#
# Switch between policies by overriding:
#   python main.py policy.type=pi05

# Current policy type: diffusion or pi05
type: pi05

# ============================================================
# Diffusion Policy (default)
# ============================================================
diffusion:
  pretrained_path: Vision-Language-Steering/vls_calvin_base
  num_inference_steps: 100
  n_obs_steps: 2
  action_chunk_horizon: 16

# ============================================================
# PI05 Policy (for LIBERO)
# ============================================================
pi05:
  pretrained_path: lerobot/pi05_libero_finetuned_v044
  num_inference_steps: 10
  action_chunk_horizon: 10


# ============================================================
# RDT-1B Policy (ManiSkill single-arm checkpoint)
# ============================================================
rdt:
  pretrained_path: robotics-diffusion-transformer/maniskill-model/rdt
  # pretrained_path: /mnt/data/hf_cache/hub/RDT-1B-LIBERO-Object/ema
  num_inference_steps: 100
  action_chunk_horizon: 8
  lang_embed_cache_dir: data/rdt_lang_embeds/


# Note: pretrained_path and other params are read from policy.{type} section in main.py


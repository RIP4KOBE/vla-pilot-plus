# @package policy
# Policy Configuration
#
# Switch between policies by overriding:
#   python main.py policy.type=pi05
#   python main.py policy.type=rdt

# Current policy type: diffusion, pi05, or rdt
type: rdt

# ============================================================
# Diffusion Policy
# ============================================================
diffusion:
  pretrained_path: Vision-Language-Steering/vls_calvin_base
  num_inference_steps: 100
  n_obs_steps: 2
  action_chunk_horizon: 16

# ============================================================
# PI05 Policy (for LIBERO)
# ============================================================
pi05:
  pretrained_path: lerobot/pi05_libero_finetuned_v044
  num_inference_steps: 10
  action_chunk_horizon: 10


# ============================================================
# RDT-1B Policy (LIBERO-finetuned checkpoint)
# ============================================================
rdt:
  pretrained_path: /mnt/data/rdt_checkpoints/rdt-libero-full-formal-20260523-140903/checkpoint-98000
  weight_variant: ema
  text_encoder: /mnt/data/hf_cache/hub/models--google--t5-v1_1-xxl
  vision_encoder: /mnt/data/hf_cache/hub/models--google--siglip-so400m-patch14-384
  num_inference_steps: null
  action_chunk_horizon: 8
  control_frequency: 20
  debug_first_step: true
  undo_libero_preprocessor_flip: true
  fail_on_zero_language_embedding: true
  semantics: libero_finetuned


# Note: pretrained_path and other params are read from policy.{type} section in main.py

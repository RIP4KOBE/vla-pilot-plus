# VLS Main Configuration
#
# Usage:
#   python main.py                                                    # Default calvin
#   python main.py backend.calvin.target_behavior=drawer_open         # CALVIN task
#   python main.py backend=libero backend.libero.suite_name=libero_goal # LIBERO
#   python main.py main.episode_num=50                                # Override params

defaults:
  - backend: libero              # Environment (calvin/libero/realworld)
  - env: null                    # Alias: env=calvin swaps backend to calvin
  - task: null                   # Optional task override (e.g. task=drawer_open)
  - perception               # Perception modules
  - policy                   # Policy config
  - _self_

# ============================================================
# Global Settings
# ============================================================
device: cuda
seed: 0

# ============================================================
# Main Experiment Settings
# ============================================================
main:
  episode_num: 10  # if using libero, need to be divisible by the number of tasks in the suite(i.e. libero_goal_task has 10 tasks, so episode_num should be divisible by 10)
  max_episode_steps: 240        # Max steps per episode (calvin.yaml references this via interpolation)
  output_dir: ${hydra:run.dir}
  cached_functions_dir: null
  visualize_trajectory: true
  debug_draw_trajectory: true
  render: true
  
  # Steering parameters
  use_guidance: false
  guidance_type: vls  # valid: vls, eds
  use_vlm_stage_recognition: true  # Use Gemini to recognize current stage
  vlm_query_limit: 50  # Max VLM queries per episode
  execution_horizon_mode: fixed  # valid: fixed, adaptive_prefix
  execution_horizon_far: 8
  execution_horizon_near: 4
  execution_horizon_contact: 2
  execution_near_distance: 0.08
  execution_contact_distance: 0.04

  vls_config:
    use_diversity: true
    sample_batch_size: 20
    guide_scale: 40.0
    diversity_scale: 10.0
    start_ratio: null
    MCMC_steps: 4
    sigmoid_k: 25.0
    sigmoid_x0: 0.75
    use_fkd: true
    fkd:
      potential_type: max
      lmbda: 10.0
      adaptive_resampling: true
      resample_frequency: 5

  eds_config:
    population_size: 16
    use_cem: false
    cem_iters: 20
    num_elites: 32
    temperature: 0.1
    renoise_t_max: 5
    renoise_t_min: 1
    initial_population_cache: null
    ed_population_cache: null
    use_initial_cache: false
    save_initial_cache: false
    save_ed_cache: false
    initial_sampling_mode: iid
    initial_diversity_scale: 1.0
    initial_diversity_start_ratio: null
    initial_diversity_fallback: iid
    initial_cache_metadata: true
    truncated_rollout_mode: baseline
    rollout_diversity_scale: 1.0
    rollout_diversity_start_ratio: 0.8
    rollout_diversity_iters: 0
    rollout_diversity_skip_final_steps: 0
    parent_weighting_mode: legacy_temperature
    selection_ess_target_ratio: 0.6
    selection_beta_max: 100.0
    selection_bisection_steps: 24
    parent_coverage_mode: none
    parent_anchor_count: 0
    parent_anchor_reward_quantile: 0.5
    elite_carryover_count: 0
    rollout_diversity_control_mode: fixed
    rollout_diversity_target_ratio: 1.0
    rollout_diversity_band_ratio: 0.2
    rollout_diversity_scale_min: 0.0
    rollout_diversity_scale_max: 20.0
    rollout_diversity_decay_floor: 0.25
    chunk_population_mode: fresh
    chunk_memory_fraction: 0.0
    chunk_memory_renoise_steps: 2
    chunk_memory_reward_guard_quantile: 0.25
    search_schedule_mode: legacy_linear
    adaptive_min_cem_iters: 4
    adaptive_early_stop_patience: 2
    adaptive_reward_improvement_eps: 0.001

  eds_eval:
    enabled: false
    write_metrics: true
    save_qualitative: false
    output_dir: ${main.output_dir}/eds_eval
    report_dir: docs/03_evidence/eds_steering
    method_label: null
    job_id: null
    reward_mode: normal  # valid: normal, zero, shuffled_keypoints, inverted
    shuffle_seed: 0
    max_visual_chunks_per_episode: 2
    save_population_cloud: true
    save_per_iter_best: true
    save_initial_vs_final: true

  eds_mechanism_pretest:
    enabled: false
    first_chunk_only: true
    save_single_step: true
    save_full_process: true
    save_tensors: true
    plot_3d: true
    output_dir: outputs/rdt_eds_mechanism_pretest
    output_mode: run_id  # valid: run_id, qualitative_chunk
    run_id: null
    max_chunks: 1
    max_full_process_iters: 10

# ============================================================
# Experiment Tracking
# ============================================================
experiment:
  name: ${backend.backend}
  tags:
    - ${backend.backend}

# ============================================================
# Hydra Settings
# ============================================================
hydra:
  run:
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/${experiment.name}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: false

# Minimal Linux environment recipe based on the installed steering environment.
# Core Python pins are observed, not a complete transitive lock. A fresh install
# must pass pip check and CPU tests before an online run; it has not been claimed
# equivalent merely because the environment solves. Do not update the shared
# vla-pilot environment in place.
name: vla-steering
channels:
  - conda-forge
dependencies:
  - python=3.12.12
  - pip=25.2
  - setuptools=80.9.0
  - ffmpeg=8.0.0
  - libegl=1.7.0
  - libgl=1.7.0
  - libglx=1.7.0
  - libstdcxx-ng=15.2.0
  - pip:
      - -r requirements-steering.txt

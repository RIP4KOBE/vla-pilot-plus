hydra:
  run:
    dir: outputs/rdt_eds_mechanism_pretest_rbf/hydra_cached
  sweep:
    dir: outputs/${experiment.name}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/rdt_eds_mechanism_pretest_rbf/hydra_cached
    - hydra.mode=RUN
    task:
    - policy.type=rdt
    - backend=libero
    - backend.libero.suite_name=libero_object
    - backend.libero.task_ids_filter=[1]
    - backend.libero.max_episode_steps=240
    - main.episode_num=1
    - main.use_vlm_stage_recognition=false
    - perception.gemini_grounding.enabled=false
    - main.cached_functions_dir=/home/hynx/VLA-Pilot++/outputs/libero/2026-06-04_13-21-01/episode_2/vlm_agent
    - main.render=false
    - main.visualize_trajectory=false
    - main.debug_draw_trajectory=false
    - main.use_guidance=true
    - main.guidance_type=eds
    - main.eds_config.population_size=16
    - main.eds_config.cem_iters=10
    - main.eds_config.use_cem=false
    - main.eds_config.initial_sampling_mode=rbf_diverse_denoise
    - main.eds_config.initial_diversity_scale=1.0
    - main.eds_config.initial_diversity_start_ratio=null
    - main.eds_eval.enabled=true
    - main.eds_eval.write_metrics=true
    - main.eds_eval.save_qualitative=false
    - main.eds_eval.reward_mode=normal
    - main.eds_mechanism_pretest.enabled=true
    - main.eds_mechanism_pretest.first_chunk_only=true
    - main.eds_mechanism_pretest.save_single_step=true
    - main.eds_mechanism_pretest.save_full_process=true
    - main.eds_mechanism_pretest.save_tensors=true
    - main.eds_mechanism_pretest.plot_3d=true
    - main.eds_mechanism_pretest.output_dir=outputs/rdt_eds_mechanism_pretest_rbf
  job:
    name: main
    chdir: false
    override_dirname: backend.libero.max_episode_steps=240,backend.libero.suite_name=libero_object,backend.libero.task_ids_filter=[1],backend=libero,main.cached_functions_dir=/home/hynx/VLA-Pilot++/outputs/libero/2026-06-04_13-21-01/episode_2/vlm_agent,main.debug_draw_trajectory=false,main.eds_config.cem_iters=10,main.eds_config.initial_diversity_scale=1.0,main.eds_config.initial_diversity_start_ratio=null,main.eds_config.initial_sampling_mode=rbf_diverse_denoise,main.eds_config.population_size=16,main.eds_config.use_cem=false,main.eds_eval.enabled=true,main.eds_eval.reward_mode=normal,main.eds_eval.save_qualitative=false,main.eds_eval.write_metrics=true,main.eds_mechanism_pretest.enabled=true,main.eds_mechanism_pretest.first_chunk_only=true,main.eds_mechanism_pretest.output_dir=outputs/rdt_eds_mechanism_pretest_rbf,main.eds_mechanism_pretest.plot_3d=true,main.eds_mechanism_pretest.save_full_process=true,main.eds_mechanism_pretest.save_single_step=true,main.eds_mechanism_pretest.save_tensors=true,main.episode_num=1,main.guidance_type=eds,main.render=false,main.use_guidance=true,main.use_vlm_stage_recognition=false,main.visualize_trajectory=false,perception.gemini_grounding.enabled=false,policy.type=rdt
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/hynx/VLA-Pilot++/.worktrees/exp/eds-init-pg-diverse-sampling
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/hynx/VLA-Pilot++/.worktrees/exp/eds-init-pg-diverse-sampling/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/hynx/VLA-Pilot++/.worktrees/exp/eds-init-pg-diverse-sampling/outputs/rdt_eds_mechanism_pretest_rbf/hydra_cached
    choices:
      task: null
      env: null
      backend: libero
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

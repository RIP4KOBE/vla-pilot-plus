hydra:
  run:
    dir: outputs/libero/rdt_full_stage_rec_true_sbs20_divs1_gs20_temp0
  sweep:
    dir: outputs/${experiment.name}/multirun/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=outputs/libero/rdt_full_stage_rec_true_sbs20_divs1_gs20_temp0
    - hydra.mode=RUN
    task:
    - policy.type=rdt
    - main.use_guidance=true
    - main.use_vlm_stage_recognition=true
    - main.episode_num=10
    - main.guide_scale=20.0
    - main.sample_batch_size=20
    - main.use_diversity=true
    - main.diversity_scale=1.0
    - main.use_fkd=true
    - +backend.libero.task_guide_scales=[20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0]
    - perception.vlm_agent.temperature=0.0
  job:
    name: main
    chdir: false
    override_dirname: +backend.libero.task_guide_scales=[20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0,20.0],main.diversity_scale=1.0,main.episode_num=10,main.guide_scale=20.0,main.sample_batch_size=20,main.use_diversity=true,main.use_fkd=true,main.use_guidance=true,main.use_vlm_stage_recognition=true,perception.vlm_agent.temperature=0.0,policy.type=rdt
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/hynx/VLA-Pilot++/.worktrees/feat/rdt-libero-gt-rollout-reintegration
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/hynx/VLA-Pilot++/.worktrees/feat/rdt-libero-gt-rollout-reintegration/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/hynx/VLA-Pilot++/.worktrees/feat/rdt-libero-gt-rollout-reintegration/outputs/libero/rdt_full_stage_rec_true_sbs20_divs1_gs20_temp0
    choices:
      task: null
      env: null
      backend: libero
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false

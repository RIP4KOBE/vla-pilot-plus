backend:
  backend: libero
  libero:
    suite_name: libero_object
    task_id: 0
    camera_name: agentview_image, robot0_eye_in_hand_image
    obs_type: pixels_agent_pos
    render_mode: rgb_array
    observation_width: 256
    observation_height: 256
    visualization_width: 640
    visualization_height: 640
    init_states: true
    num_steps_wait: 10
    vlm_camera: agentview
    auto_apply_perturbations: true
    task_ids_filter: null
perception:
  keypoint_detector:
    num_candidates_per_mask: 5
    min_dist_bt_keypoints: 0.05
    max_mask_ratio: 0.5
    device: ${device}
    seed: ${seed}
    bounds_min:
    - -1.0
    - -0.75
    - -0.1
    bounds_max:
    - 1.0
    - 0.75
    - 1.2
    feature_extractor: dinov2_vitb14
  vlm_agent:
    base_url: null
    model: gpt-4o
    api_key: null
    temperature: 1.0
    max_completion_tokens: 2000
    query_template_dir: vlm_query/
  sam3:
    enabled: false
  gemini_grounding:
    enabled: true
    api_key: null
    model: gemini-2.5-flash
    default_objects:
    - drawer handle
    - sliding handle
    - slider handle
    - black switch
    - red cube
    - blue cube
    - pink cube
  gemini:
    api_key: null
    model: gemini-2.5-flash
policy:
  type: rdt
  diffusion:
    pretrained_path: Vision-Language-Steering/vls_calvin_base
    num_inference_steps: 100
    n_obs_steps: 2
    action_chunk_horizon: 16
  pi05:
    pretrained_path: lerobot/pi05_libero_finetuned_v044
    num_inference_steps: 10
    action_chunk_horizon: 10
  rdt:
    pretrained_path: robotics-diffusion-transformer/maniskill-model/rdt
    vision_encoder: google/siglip-so400m-patch14-384
    num_inference_steps: 55
    action_chunk_horizon: 8
    lang_embed_cache_dir: data/rdt_lang_embeds/
device: cuda
seed: 0
main:
  episode_num: 10
  max_episode_steps: 240
  output_dir: ${hydra:run.dir}
  cached_functions_dir: null
  visualize_trajectory: true
  debug_draw_trajectory: true
  render: true
  use_guidance: false
  use_vlm_stage_recognition: true
  vlm_query_limit: 50
  use_diversity: true
  sample_batch_size: 20
  guide_scale: 40.0
  diversity_scale: 10.0
  start_ratio: null
  MCMC_steps: 4
  sigmoid_k: 25.0
  sigmoid_x0: 0.75
  use_fkd: true
  fkd:
    potential_type: max
    lmbda: 10.0
    adaptive_resampling: true
    resample_frequency: 5
experiment:
  name: ${backend.backend}
  tags:
  - ${backend.backend}
